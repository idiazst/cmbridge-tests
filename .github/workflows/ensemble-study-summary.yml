name: Report frozen ensemble study checkpoints

on:
  workflow_dispatch:
    inputs:
      study_run:
        description: Run ID of the frozen simulation
        required: true
        default: '37417223244'
      early_checkpoints:
        description: Report only the early batches as preliminary
        type: boolean
        default: false
      checkpoint_runs:
        description: Optional comma-separated resume run IDs to merge with the original run
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  FROZEN_ROOT: ${{ github.workspace }}/results/observed-history-corrected/full-ensemble-study-v2
  STUDY_SOURCE: ${{ github.workspace }}/results/observed-history-corrected/full-ensemble-study-v2/source/simulations/observed_history_corrected
  SIM_OUTPUT: ${{ github.workspace }}/cloud-aggregate
  CLOUD_INCOMING: ${{ github.workspace }}/cloud-incoming

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: actions/download-artifact@v4
        with:
          name: cloud-preparation-${{ inputs.study_run }}
          path: cloud-preparation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.study_run }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.early_checkpoints && 'cloud-early' || 'cloud-shard' }}-${{ inputs.study_run }}-*
          path: cloud-raw-incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.study_run }}
      - name: Download additional resumed checkpoints
        if: inputs.checkpoint_runs != ''
        env:
          CHECKPOINT_RUNS: ${{ inputs.checkpoint_runs }}
          GH_TOKEN: ${{ github.token }}
        shell: python3 {0}
        run: |
          import json, os, pathlib, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          runs = os.environ['CHECKPOINT_RUNS'].split(',')
          assert all(re.fullmatch(r'[0-9]+', run) for run in runs)
          assert len(runs) == len(set(runs))
          for run in runs:
              pages = json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',
                  f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100']))
              artifacts = [item for page in pages for item in page['artifacts']]
              matching = [item for item in artifacts if re.fullmatch(
                  rf'cloud-resume-{run}-[0-9]+', item['name'])]
              assert matching, f'No saved resume artifacts for run {run}'
              for item in matching:
                  assert not item['expired'], 'Retain local copies before expiration.'
                  destination = pathlib.Path('cloud-raw-incoming') / item['name']
                  subprocess.run(['gh','run','download',run,'--repo',repo,
                      '--name',item['name'],'--dir',str(destination)],check=True)
      - name: Merge byte-identical duplicates before aggregation
        shell: python3 {0}
        run: |
          import os, pathlib, re, subprocess
          incoming = pathlib.Path('cloud-raw-incoming')
          pattern = re.compile(r'cloud-(?:early|shard|resume)-[0-9]+-([0-9]+)$')
          shards = sorted({int(pattern.fullmatch(path.name).group(1))
              for path in incoming.iterdir() if path.is_dir() and pattern.fullmatch(path.name)})
          assert shards, 'No checkpoint artifacts to summarize'
          for shard in shards:
              subprocess.run(['python3','simulations/observed_history_corrected/restore_cloud_checkpoints.py',
                  '--incoming',str(incoming),'--output',
                  str(pathlib.Path(os.environ['CLOUD_INCOMING']) / f'cloud-merged-{shard}'),
                  '--shard',str(shard)],check=True)
      - name: Verify and extract frozen sources and shared Linux library
        run: |
          cd "$FROZEN_ROOT"
          sha256sum -c PACKAGE-SHA256SUMS
          tar -xzf packages/frozen-source.tar.gz
          sha256sum -c SOURCE-SHA256SUMS
          cd "$GITHUB_WORKSPACE/cloud-preparation"
          sha256sum -c cloud-library.sha256
          tar -xzf cloud-library.tar.gz -C "$GITHUB_WORKSPACE"
          echo "R_LIBS_USER=$GITHUB_WORKSPACE/cloud-library" >> "$GITHUB_ENV"
      - name: Aggregate without mixing fingerprints or duplicate seeds
        run: |
          Rscript simulations/observed_history_corrected/aggregate_cloud_study.R
          mkdir -p "$SIM_OUTPUT/source/reports"
          cp "$FROZEN_ROOT/source/reports/simulation-plan.md" "$SIM_OUTPUT/source/reports/"
          cp "$FROZEN_ROOT/PACKAGE-SHA256SUMS" "$FROZEN_ROOT/SOURCE-SHA256SUMS" "$SIM_OUTPUT/"
          cp "$GITHUB_WORKSPACE/cloud-preparation/cloud-prepare/dependency-versions.csv" "$SIM_OUTPUT/"
          echo '${{ inputs.study_run }}' > "$SIM_OUTPUT/parent-study-run.txt"
          echo '${{ inputs.checkpoint_runs }}' > "$SIM_OUTPUT/resume-runs.txt"
          echo '${{ github.sha }}' > "$SIM_OUTPUT/aggregation-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-report-${{ github.run_id }}
          path: |
            cloud-aggregate/**
            !cloud-aggregate/jobs/**
          retention-days: 1
          if-no-files-found: error
      - name: Require all planned checkpoints for a final report
        if: inputs.early_checkpoints == false
        shell: Rscript {0}
        run: |
          x<-data.table::fread(file.path(Sys.getenv('SIM_OUTPUT'),'job_log.csv'))
          stopifnot(nrow(x)==1200L,all(x[,.N,by=.(mechanism,n)]$N==200L))
